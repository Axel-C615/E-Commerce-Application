spring.application.name=application_e-commerce
server.port=8082

# ===== DATABASE CONFIGURATION - CORRIGÉE =====
# Ajout de allowPublicKeyRetrieval=true et correction du nom de base
spring.datasource.url=jdbc:mysql://localhost:3306/dbVente?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA/HIBERNATE CONFIGURATION - CORRIGÉE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== THYMELEAF CONFIGURATION =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== PAYMENT CONFIGURATION =====
payment.mode=simulate

# ===== PAYPAL CONFIGURATION (test mode) =====
paypal.client.id=YOUR_PAYPAL_CLIENT_ID
paypal.client.secret=YOUR_PAYPAL_CLIENT_SECRET
paypal.mode=sandbox

# ===== IMAGE STORAGE CONFIGURATION =====
app.upload.dir=uploads/images/
app.upload.max-file-size=5MB
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp
app.image.default=/images/default-product.jpg

# ===== ADDITIONAL RECOMMENDED CONFIGURATIONS =====
# Connection pool configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Logging pour debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO