<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout/base :: header">
    <title>Nos articles - Ma Boutique</title>
</head>
<body>

<nav th:replace="layout/base :: navbar"></nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <i class="fas fa-boxes"></i>
            <span th:if="${categorieActuelle}" th:text="'Catégorie: ' + ${categorieActuelle}"></span>
            <span th:unless="${categorieActuelle}">Tous nos articles</span>
        </h1>
        <span class="badge bg-secondary fs-6" th:text="${#lists.size(articles)} + ' article(s)'"></span>
    </div>

    <!-- Barre de recherche et filtres -->
    <div class="row mb-4 g-3">
        <div class="col-md-6">
            <form th:action="@{/articles/recherche}" method="get" class="d-flex gap-2">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" name="keyword" class="form-control"
                           placeholder="Rechercher un article..." th:value="${keyword}">
                    <button type="submit" class="btn btn-primary">Rechercher</button>
                </div>
            </form>
        </div>
        <div class="col-md-3">
            <div class="dropdown w-100">
                <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown">
                    <i class="fas fa-filter"></i> Filtrer par catégorie
                </button>
                <ul class="dropdown-menu w-100">
                    <li><a class="dropdown-item" th:href="@{/articles}">
                        <i class="fas fa-list"></i> Toutes les catégories
                    </a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li th:each="cat : ${categories}">
                        <a class="dropdown-item" th:href="@{/articles/categorie/{cat}(cat=${cat})}"
                           th:text="${cat}"></a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="sortSelect">
                <option value="default">Trier par</option>
                <option value="price-asc">Prix croissant</option>
                <option value="price-desc">Prix décroissant</option>
                <option value="name-asc">Nom A-Z</option>
            </select>
        </div>
    </div>

    <!-- Grille des articles -->
    <div class="row" id="productsGrid">
        <div class="col-md-4 col-lg-3 mb-4" th:each="article : ${articles}">
            <div class="card product-card h-100 shadow-sm">
                <div class="position-relative">
                    <img th:if="${article.imageUrl}"
                         th:src="${article.imageUrl}"
                         th:alt="${article.nom}"
                         class="card-img-top product-image"
                         loading="lazy"
                         onerror="this.src='/images/default-product.jpg'">
                    <img th:unless="${article.imageUrl}"
                         src="/images/default-product.jpg"
                         class="card-img-top product-image"
                         alt="Image par défaut">
                    <div class="stock-badge">
                        <span th:if="${article.stock > 0}" class="badge bg-success">
                            <i class="fas fa-check-circle"></i> En stock
                        </span>
                        <span th:unless="${article.stock > 0}" class="badge bg-danger">
                            <i class="fas fa-times-circle"></i> Rupture
                        </span>
                    </div>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${article.nom}">Nom article</h5>
                    <p class="card-text text-muted small">
                        <i class="fas fa-tag"></i> <span th:text="${article.categorie}">Catégorie</span>
                    </p>
                    <p class="card-text" th:text="${#strings.abbreviate(article.description, 80)}">Description</p>
                    <div class="price" th:text="'€' + ${#numbers.formatDecimal(article.prix, 1, 2)}">Prix</div>
                    <div th:if="${article.stock > 0 and article.stock <= 5}" class="text-warning small mt-2">
                        <i class="fas fa-exclamation-triangle"></i> Plus que <span th:text="${article.stock}"></span> en stock !
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <form th:if="${article.stock > 0}" method="post"
                          th:action="@{/panier/ajouter/{id}(id=${article.id})}"
                          class="d-flex gap-2">
                        <input type="number" name="quantite" value="1" min="1"
                               th:max="${article.stock}" class="form-control form-control-sm" style="width: 70px;">
                        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                            <i class="fas fa-shopping-cart"></i> Ajouter
                        </button>
                    </form>
                    <button th:unless="${article.stock > 0}" class="btn btn-secondary btn-sm w-100" disabled>
                        <i class="fas fa-ban"></i> Indisponible
                    </button>
                    <a th:href="@{/articles/{id}(id=${article.id})}"
                       class="btn btn-outline-secondary btn-sm w-100 mt-2">
                        <i class="fas fa-eye"></i> Voir détails
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Message si aucun article -->
    <div th:if="${#lists.isEmpty(articles)}" class="alert alert-info text-center py-5">
        <i class="fas fa-box-open fa-3x mb-3"></i>
        <h4>Aucun article trouvé</h4>
        <p>Essayez de modifier vos critères de recherche.</p>
        <a th:href="@{/articles}" class="btn btn-primary">Voir tous les articles</a>
    </div>

</div>

<div th:replace="layout/base :: scripts"></div>
</body>
</html>
