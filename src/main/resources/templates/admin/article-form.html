<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout/base :: header">
    <title>Gestion article - Admin</title>
</head>
<body>

<nav th:replace="layout/base :: navbar"></nav>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">
                <i class="fas fa-box"></i>
                <span th:if="${article.id == null}">Ajouter un nouvel article</span>
                <span th:unless="${article.id == null}">Modifier l'article</span>
            </h4>
        </div>
        <div class="card-body">
            <form th:action="${article.id == null ? '/articles/admin/save' : '/articles/admin/update/' + article.id}"
                  method="post" enctype="multipart/form-data">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom de l'article *</label>
                        <input type="text" name="nom" th:value="${article.nom}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Catégorie *</label>
                        <select name="categorie" class="form-control" required>
                            <option value="">Sélectionner une catégorie</option>
                            <option value="Electronique" th:selected="${article.categorie == 'Electronique'}">📱 Electronique</option>
                            <option value="Informatique" th:selected="${article.categorie == 'Informatique'}">💻 Informatique</option>
                            <option value="Audio"        th:selected="${article.categorie == 'Audio'}">🎧 Audio</option>
                            <option value="Vêtements"    th:selected="${article.categorie == 'Vêtements'}">👕 Vêtements</option>
                            <option value="Maison"       th:selected="${article.categorie == 'Maison'}">🏠 Maison</option>
                            <option value="Sport"        th:selected="${article.categorie == 'Sport'}">⚽ Sport</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Prix (€) *</label>
                        <input type="number" step="0.01" name="prix" th:value="${article.prix}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Stock *</label>
                        <input type="number" name="stock" th:value="${article.stock}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Disponible</label>
                        <select name="disponible" class="form-control">
                            <option th:value="true"  th:selected="${article.disponible}">Oui</option>
                            <option th:value="false" th:selected="${!article.disponible}">Non</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="5"
                              th:text="${article.description}"></textarea>
                </div>

                <!-- Gestion de l'image -->
                <div class="mb-3">
                    <label class="form-label">Image du produit</label>

                    <div th:if="${article.imageUrl}" class="mb-3">
                        <p>Image actuelle :</p>
                        <img th:src="${article.imageUrl}" style="max-width:150px; max-height:150px; object-fit:cover; border-radius:10px;">
                        <div class="mt-2">
                            <a th:href="@{/articles/admin/delete-image/{id}(id=${article.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Supprimer cette image ?')">
                                <i class="fas fa-trash"></i> Supprimer l'image
                            </a>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">
                            <span th:if="${article.imageUrl}">Changer d'image</span>
                            <span th:unless="${article.imageUrl}">Ajouter une image</span>
                            <span class="text-muted"> (optionnel)</span>
                        </label>
                        <input type="file" name="imageFile" id="imageFile" class="form-control"
                               accept="image/jpeg,image/png,image/gif,image/webp"
                               onchange="previewImage(this)">
                        <small class="text-muted">Formats acceptés : JPG, PNG, GIF, WEBP. Taille max : 5MB</small>
                        <div class="mt-3">
                            <img id="imagePreview" style="max-width:200px; max-height:200px; object-fit:cover; display:none; border-radius:10px;">
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                    <a th:href="@{/articles}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="layout/base :: scripts"></div>
<script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.style.display = 'block';
                preview.src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.style.display = 'none';
            preview.src = '';
        }
    }
</script>
</body>
</html>
