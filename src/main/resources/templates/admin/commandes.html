<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/base :: header">
    <title>Commandes - Administration</title>
</head>
<body>
    <div th:fragment="content">
        <h1 class="mb-4"><i class="fas fa-list-alt"></i> Toutes les commandes</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>N° commande</th>
                                <th>Client</th>
                                <th>Montant</th>
                                <th>Date</th>
                                <th>Mode paiement</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cmd : ${commandes}">
                                <td th:text="${cmd.id}">1</td>
                                <td th:text="${cmd.numeroCommande}">CMD-xxx</td>
                                <td th:text="${cmd.utilisateur.email}">client@email.com</td>
                                <td th:text="'€' + ${cmd.montantTotal}">0</td>
                                <td th:text="${#temporals.format(cmd.dateCommande, 'dd/MM/yyyy HH:mm')}">date</td>
                                <td th:text="${cmd.modePaiement}">MODE</td>
                                <td>
                                    <form th:action="@{/admin/commande/{id}/statut(id=${cmd.id})}" method="post" class="d-inline">
                                        <select name="statut" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
                                            <option value="EN_ATTENTE" th:selected="${cmd.statut == 'EN_ATTENTE'}">En attente</option>
                                            <option value="PAYEE" th:selected="${cmd.statut == 'PAYEE'}">Payée</option>
                                            <option value="ANNULEE" th:selected="${cmd.statut == 'ANNULEE'}">Annulée</option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <a th:href="@{/admin/commande/{id}(id=${cmd.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
