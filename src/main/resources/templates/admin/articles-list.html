<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/base :: header">
    <title>Gestion articles - Administration</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-boxes"></i> Gestion des articles</h1>
            <a th:href="@{/admin/article/nouveau}" class="btn btn-success">
                <i class="fas fa-plus"></i> Nouvel article
            </a>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Nom</th>
                                <th>Catégorie</th>
                                <th>Prix</th>
                                <th>Stock</th>
                                <th>Disponible</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="article : ${articles}">
                                <td th:text="${article.id}">1</td>
                                <td>
                                    <img th:if="${article.imageUrl}" th:src="${article.imageUrl}" 
                                         style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                                </td>
                                <td th:text="${article.nom}">Nom</td>
                                <td th:text="${article.categorie}">Catégorie</td>
                                <td th:text="'€' + ${article.prix}">0</td>
                                <td>
                                    <input type="number" th:value="${article.stock}" 
                                           class="form-control form-control-sm stock-input" 
                                           style="width: 80px;"
                                           th:data-id="${article.id}"
                                           onchange="updateStock(this)">
                                </td>
                                <td>
                                    <span class="badge" th:class="${article.disponible} ? 'bg-success' : 'bg-danger'"
                                          th:text="${article.disponible} ? 'Disponible' : 'Indisponible'"></span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/article/edit/{id}(id=${article.id})}" class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/article/delete/{id}(id=${article.id})}" class="btn btn-sm btn-danger"
                                       onclick="return confirm('Supprimer cet article ?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function updateStock(input) {
            let id = input.getAttribute('data-id');
            let stock = input.value;
            
            fetch('/admin/article/' + id + '/stock?stock=' + stock, {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
