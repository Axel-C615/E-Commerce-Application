<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Ma Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { padding-top: 70px; }
        .product-image { height: 200px; object-fit: cover; }
        .stock-badge { position: absolute; top: 8px; right: 8px; }
        .price { font-size: 1.3rem; font-weight: bold; color: #0d6efd; }
    </style>
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="fas fa-store"></i> Ma Boutique
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/articles}">
                        <i class="fas fa-box"></i> Articles
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panier}">
                        <i class="fas fa-shopping-cart"></i> Panier
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <a class="nav-link" th:href="@{/commande/historique}">
                        <i class="fas fa-history"></i> Mes commandes
                    </a>
                </li>
                
                <!-- ========== MENU ADMIN COMPLET ========== -->
                <li sec:authorize="hasRole('ADMIN')" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-shield"></i> Administration
                    </a>
                    <ul class="dropdown-menu">
                        <!-- Dashboard -->
                        <li><a class="dropdown-item" th:href="@{/admin/dashboard}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        
                        <!-- Gestion des commandes -->
                        <li><a class="dropdown-item" th:href="@{/admin/commandes}">
                            <i class="fas fa-list-alt"></i> Toutes les commandes
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        
                        <!-- Gestion des articles -->
                        <li><a class="dropdown-item" th:href="@{/admin/articles}">
                            <i class="fas fa-boxes"></i> Gérer les articles
                        </a></li>
                        <li><a class="dropdown-item" th:href="@{/articles/admin/nouveau}">
                            <i class="fas fa-plus"></i> Ajouter un article
                        </a></li>
                    </ul>
                </li>
                <!-- ========== FIN MENU ADMIN ========== -->
                
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user"></i> <span sec:authentication="name">Utilisateur</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt"></i> Déconnexion
                        </a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="fas fa-sign-in-alt"></i> Connexion
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link btn btn-primary text-white ms-2" th:href="@{/inscription}">
                        <i class="fas fa-user-plus"></i> Inscription
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
