<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout/base :: header">
    <title>Paiement réussi - Ma Boutique</title>
</head>
<body>

<nav th:replace="layout/base :: navbar"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-sm border-success">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
                    </div>
                    <h1 class="text-success mb-3">Paiement réussi !</h1>
                    <p class="lead">Merci pour votre commande.</p>

                    <div class="alert alert-info mt-4">
                        <strong>Numéro de commande :</strong>
                        <span class="fs-5" th:text="${commande.numeroCommande}"></span>
                    </div>

                    <p>Un email de confirmation vous sera envoyé.</p>

                    <hr class="my-4">

                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a th:href="@{/}" class="btn btn-primary">
                            <i class="fas fa-home"></i> Accueil
                        </a>
                        <a th:href="@{/commande/historique}" class="btn btn-outline-secondary">
                            <i class="fas fa-history"></i> Mes commandes
                        </a>
                        <a th:href="@{/articles}" class="btn btn-outline-success">
                            <i class="fas fa-shopping-bag"></i> Continuer mes achats
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="layout/base :: scripts"></div>
</body>
</html>
